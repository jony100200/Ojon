name: Windows Rust Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojon-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: CLI and Kathamo GUI
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check CLI and backend
        run: cargo check --locked --bin ojon

      - name: Test Rust backend and CLI
        run: cargo test --locked --lib --bin ojon

      - name: Syntax check bundled HQQ bridge
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('src/workflows/hqq_bridge.py').read_text(encoding='utf-8'))"

      - name: Test ComfyUI GGUF adapter with offline mock API
        run: python -m unittest discover -s scripts -p "test_comfy_gguf_smoke.py" -v

      - name: Check Kathamo desktop GUI
        run: cargo check --locked --features gui --bin ojon-gui

      - name: Test GUI state and CPU rendering
        env:
          OJON_SCREENSHOT_DIR: ${{ runner.temp }}
        run: cargo test --locked --features gui --bin ojon-gui

      - name: Convert real CPU-rendered UI preview
        run: python scripts/ppm_to_png.py "${{ runner.temp }}/ojon_workstation_render.ppm" "${{ runner.temp }}/ojon_workstation_render.png"

      - name: Upload Ojon workstation UI preview
        uses: actions/upload-artifact@v4
        with:
          name: ojon-kathamo-workstation-preview
          path: ${{ runner.temp }}/ojon_workstation_render.png
          if-no-files-found: error
