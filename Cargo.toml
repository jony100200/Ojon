[package]
name = "ojon"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jony100200/Ojon"
description = "Local-first orchestration for real AI model quantization backends"

[lib]
name = "ojon_backend"
path = "src/lib.rs"

[[bin]]
name = "ojon"
path = "src/main.rs"

# Core Ojon backend remains GUI-free; Kathamo is opt-in via the gui feature.
# Existing CUDA/SVDQ/LLM optimizers are optional; native scalar weight packing is built into Rust.
[features]
default = []
gui = [
    "dep:ui-core", "dep:ui-platform", "dep:ui-render",
    "dep:ui-themes", "dep:ui-widgets", "dep:windows-sys",
]

[[bin]]
name = "ojon-gui"
# Cargo binary launcher; implementation lives in src/frontend/.
path = "src/bin/ojon_gui.rs"
required-features = ["gui"]

[dependencies]
# Small, bounded on-demand metadata inspection and machine-readable agent protocol.
serde_json = "1"
serde_yaml = "0.9"
# Pinned public Kathamo framework; optional so the CLI stays lean and independent.
ui-core     = { git = "https://github.com/jony100200/Kathamo", rev = "d96108fb304afd63c0b32b79731829bcf04d3459", optional = true }
ui-platform = { git = "https://github.com/jony100200/Kathamo", rev = "d96108fb304afd63c0b32b79731829bcf04d3459", optional = true }
ui-render   = { git = "https://github.com/jony100200/Kathamo", rev = "d96108fb304afd63c0b32b79731829bcf04d3459", optional = true }
ui-themes   = { git = "https://github.com/jony100200/Kathamo", rev = "d96108fb304afd63c0b32b79731829bcf04d3459", optional = true }
ui-widgets  = { git = "https://github.com/jony100200/Kathamo", rev = "d96108fb304afd63c0b32b79731829bcf04d3459", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", optional = true, features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

# Keep routine development/test build artifacts small, especially on Windows.
# Retain line information for useful panic backtraces; opt into the debugging
# profile below when a full native debugger session is needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

# Default release builds favor quantization throughput, not minimum binary size.
# Thin LTO, single codegen unit and stripping reduce distributable size without
# lowering the normal release optimization level.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Opt-in minimum-size build: may be slower for computationally intensive work.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
